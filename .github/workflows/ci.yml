name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  ci:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies (clean)
        run: npm ci

      - name: Verify package-lock.json is clean
        run: git diff --exit-code package-lock.json

      - name: Security audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Lint codebase
        run: npm run lint

      - name: Run server tests
        run: npm test
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/devarena_test
          JWT_SECRET: super-secret-jwt-key-with-over-thirty-two-chars-length

      - name: Build client application
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.devarena.example.com
